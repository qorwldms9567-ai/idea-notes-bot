name: Collect Telegram Ideas to Notion

on:
  schedule:
    - cron: '55 14 * * *'   # 매일 23:55 KST (자정 루틴보다 5분 전)
  workflow_dispatch: {}      # 수동으로도 "Run workflow" 눌러서 테스트 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Telegram updates and push new ideas to Notion
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          set -uo pipefail

          echo "Token length (should be ~46): ${#TELEGRAM_BOT_TOKEN}"
          echo "Notion token length (should be ~50): ${#NOTION_TOKEN}"
          echo "Page id length (should be 32): ${#NOTION_PAGE_ID}"

          updates=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates")
          echo "Raw Telegram response: $updates"
          echo "Total updates fetched: $(echo "$updates" | jq '.result | length')"

          echo "$updates" | jq -c \
            '.result[]? | select(.message.chat.id == -5431617150 and (.message.text != null)) | .message' \
            > messages.jsonl
          echo "Matched idea messages: $(wc -l < messages.jsonl)"

          if [ -s messages.jsonl ]; then
            children="[]"
            while IFS= read -r msg; do
              text=$(echo "$msg" | jq -r '.text')
              date_unix=$(echo "$msg" | jq -r '.date')
              date_str=$(date -u -d "@${date_unix}" +"%Y-%m-%d %H:%M UTC")
              block=$(jq -n --arg t "📥 [$date_str] $text" \
                '{object:"block", type:"paragraph", paragraph:{rich_text:[{type:"text", text:{content:$t}}]}}')
              children=$(echo "$children" | jq --argjson b "$block" '. + [$b]')
            done < messages.jsonl

            body=$(jq -n --argjson c "$children" '{children:$c}')
            resp=$(curl -s -w "HTTP_STATUS:%{http_code}" -X PATCH "https://api.notion.com/v1/blocks/${NOTION_PAGE_ID}/children" \
              -H "Authorization: Bearer ${NOTION_TOKEN}" \
              -H "Notion-Version: 2022-06-28" \
              -H "Content-Type: application/json" \
              -d "$body")
            echo "Notion API response: $resp"
            echo "Appended $(wc -l < messages.jsonl) idea(s) to Notion."
          else
            echo "No new idea messages."
          fi

          max_update_id=$(echo "$updates" | jq '[.result[]?.update_id] | if length > 0 then max else empty end')
          if [ -n "${max_update_id:-}" ]; then
            offset=$((max_update_id + 1))
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${offset}" > /dev/null
            echo "Cleared Telegram update queue up to offset ${offset}."
          fi
